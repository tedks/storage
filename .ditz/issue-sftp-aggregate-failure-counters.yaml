id: sftp-aggregate-failure-counters
title: Expose filename-free transport, channel and request failure counters in live
  status
desc: Live status at 0fa941f counts streaming open failures but cannot explain reports
  of dropped SFTP sessions. Count transport losses/reconnects, channel failures on
  a surviving transport, capacity waits/timeouts, and operation timeouts by bounded
  category. Expose these via the existing aggregate control status with no paths or
  exception strings. Exercise an injected channel-only failure, a whole transport
  drop and a slow request, including successful retries. Keep a request failure distinct
  from the underlying connection incident.
type: feature
