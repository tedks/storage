id: gh-64-writer-count
title: Track a count of open writers per canonical_path
desc: 'Increment when an entry is registered (fs.py:859,889) and decrement on pop
  (:1000), counting only the descriptors the current check counts (skip read-only
  and prefetch entries). Fd entries are not re-keyed on rename today, so the count
  need not be either.

  From https://github.com/tedks/storage/issues/64.'
