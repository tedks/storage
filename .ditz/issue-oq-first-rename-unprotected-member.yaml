  comment: 'Ted approved the conservative first-attempt fallback. For a member where
    replacement was not intended, use a verified non-overwriting operation or skip
    that member mutation, report partial failure and retain a durable repair via #182.
    Both names and their bytes must survive a refusal. Some ordinary SSH directory
    moves will require manual repair even without a collision. Preserve intentional
    replacement and distinguish incomplete member knowledge from observed absence.
    The decision clears the PR167 merge hold and authorizes PR183 implementation.'
