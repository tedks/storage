id: cache-parent-symlink-traversal
title: Cache paths are not checked for a symlinked directory component
desc: 'From the PR #159 council (Codex, marked Critical; Claude nit 4). regular_file_stat,
  follow_symlinks=False and get_cache_path check only the last component of a cache
  path; a directory component that is a link is traversed (setxattr, write_cache_metadata,
  cache_file''s parent.mkdir + os.link). Triage: through the mount none can be reached,
  because getattr lstats the cache first, so a cached link is reported as S_IFLNK
  and the kernel resolves it itself and never sends a path beneath it; os.walk scans
  do not follow directory links. Internal paths (index rows, member virtual paths)
  beneath a link need a link planted by someone who can already write the cache directory,
  which is the daemon''s own. Fix if wanted: resolve cache paths component-wise with
  openat/O_NOFOLLOW (dir fds), or check that the resolved parent stays under cache_root.
  Not urgent.'
type: task
