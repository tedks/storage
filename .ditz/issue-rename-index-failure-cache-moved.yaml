id: rename-index-failure-cache-moved
title: A failed rename_path does not undo the cache move
desc: 'NamespaceService.rename moves the cache entry and then calls StateManager.rename_path
  under metadata_lock. If rename_path raises (a SQLite error; the ENOTEMPTY backstop
  is unreachable behind the pre-check from PR #149), the index rolls back to the old
  paths while the cache entry is at the new name: the index rows point at a missing
  cache file and the new name has an unindexed cache entry. Options: move the cache
  back on failure (it can fail too), or order the index rewrite first. Found by council
  round 1 on PR #149.'
type: bugfix
