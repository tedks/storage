id: mount-sigpipe-test-gaps
title: Test the SIGPIPE guard from a non-main thread and with a real failed write
desc: 'Council on PR #142 nits (Claude and codex seats). tests/test_mount_sigpipe.py
  checks dispositions, not a failed write: add a subprocess/socket test that writes
  to a closed peer during destroy() and expects BrokenPipeError. Also cover mount_storage
  called from a non-main thread (guard yields, nothing raised) and foreground=False.
  Not blocking: the dispositions are what libfuse changes, and the real-libfuse tests
  record them.'
