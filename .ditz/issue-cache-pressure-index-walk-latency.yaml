id: cache-pressure-index-walk-latency
title: Bound the time an eviction scan can hold up unrelated cache writes
desc: 'At the #191 stacked head 4a631a6, exhausted-victim results survive pure access
  churn. With 2,000 synthetic CLEAN rows, 100 attempts over ten fake-clock seconds
  caused ten index walks with zero, one, or 256 touches per allocation. The first
  scan and a later scan required by expiry, pin release or real eligibility change
  still perform O(index rows) work under the cache lock. A barrier that paused the
  first scan for half a second also paused an ordinary write to an unrelated inode;
  a cached shortfall allowed that write through immediately. These were synthetic
  observations.


  Measure the lock hold and row visits across larger indexes, including a workload
  releasing unrelated descriptors. Evaluate bounded or incremental candidate enumeration
  while keeping access order, the live pin and recoverability checks, and a single
  atomic admission decision. Use a barrier-based test that an unrelated ordinary write
  can continue during expensive candidate discovery. Preserve the behavior that allocation
  never evicts useful data when even the eligible candidates cannot make it fit.'
