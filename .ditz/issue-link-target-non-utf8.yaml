id: link-target-non-utf8
title: readlink of a non-UTF-8 member link target fails in fusepy
desc: 'Council PR #158 nit (Claude seat): paramiko and os.readlink give a surrogate-escaped
  str for a non-UTF-8 target; fusepy encodes readlink''s result strictly as UTF-8
  and raises. Same class as fusepy''s path handling for non-UTF-8 names; fix together
  (return bytes or encode with surrogateescape) if it matters.'
