id: gh-111-parallel-listing
title: List members concurrently in readdir
desc: After gh-111-listing-attrs, a 3-member listing over a 46 ms VPN is ~1.4 s, mostly
  three sequential listdir_attr calls (~0.8 s). List members concurrently (one per
  thread client). Also consider passing attr_timeout/entry_timeout to FUSE() so a
  listing larger than one second's worth of lookups stays inside the cached attrs.
