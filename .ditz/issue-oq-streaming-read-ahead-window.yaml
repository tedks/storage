id: oq-streaming-read-ahead-window
title: Should streaming read-ahead while open get its own window setting?
desc: 'Context: #126 (ditz streaming-bound-readahead-while-open) bounds read-ahead
  while a file is open, until readers show consumption, by the existing streaming_keep_after_close
  threshold. Both council seats noted the coupling: a stricter after-close policy
  (a large threshold such as 50% or 100%) also loosens the bound while open, so with
  ''100%'' a reader holding a file open after a small read can pull from that read
  to EOF. With the default (4 chunks or 50%, i.e. 4M at 1M chunks) the byte term dominates
  and the bound is 4 MiB.

  Options: (A) keep the coupling, documented in the README (what #126 ships); (B)
  add streaming_read_ahead_window (bytes, default = the keep-after-close threshold''s
  byte term), independent of the close policy; (C) bound by min(threshold, fixed 4
  chunks) with no new knob, so a percent-only close policy cannot widen it.

  Recommendation: A now; revisit with B if a percent-only or large keep-after-close
  value is used in practice. Who decides: Ted. Blocks: nothing (#126 merges with A;
  B or C is a follow-up).'
type: task
