id: recomputable-eviction-placeholder-read
title: Reopen an evicted recomputable file through reconstruction
desc: 'Reproduced at 59e8d28 using a Bazel tests/test_fs_streaming.py fixture with
  a disposable StorageFS, directory cache, and local member.


  Write b"computed" to /computed.bin on the fixture member. Set a cache-root user.storage.config
  that marks the file recomputable and names a command that writes b"computed" to
  STORAGE_OUTPUT. With streaming disabled, open/read /computed.bin to populate the
  clean cached copy and verify that the recompute engine recognizes the command. Set
  the cache budget to exactly the payload''s length and call ensure_space(1). Eviction
  truncates the cache inode to a zero-byte placeholder. Reopening and reading through
  StorageFS yields b"" instead of b"computed".


  The regular-file cache check accepts the placeholder and returns before the recompute
  engine can run. Preserve legitimate zero-length file semantics while identifying
  placeholders in a way that survives reopen and index rebuild. Cover the first read
  after eviction and repeated open, with no sync of the placeholder back to a member.
  See recomputable-eviction-stale-mtime for the separate stale-stat-induced DIRTY
  path.'
type: bugfix
