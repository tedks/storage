id: storage171-uncertain-local-recovery
title: Settle uncertain local state after a later authoritative DIRTY mark
desc: 'PR #171 foreground responsiveness. Root and warm Sol first found that failed
  DIRTY publication left uncertain_local permanent after a later successful write.
  The sequential repair at 832571d had focused evidence, but root review returned
  FINDINGS: two overlapping successful writes could still leave uncertainty permanent
  when the older writer finalized last. The bounded overlap repair at pushed 053b5d3
  tracks the whole active mutation group: all participants must publish DIRTY for
  the current inode before uncertainty clears; any failed or mismatched participant
  retains it until a later independent successful group. An Event-gated identical
  pre-fix schedule failed at post-eviction refetch ENOENT; both successful completion
  orders and a later failed mark guard passed after repair. Exact-head nonmount revalidation
  57/57, streaming 66/66, selected threading 30/30 passed. Root delta review is pending;
  retain in_progress until acceptance. Durable marker/restart and rename/unlink identity
  are separate incomplete slices.'
