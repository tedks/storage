id: storage-channel-reserve-tracer
title: Classify foreground cold copies as bulk while preserving listing reserve
desc: Independent bounded channel-classification tracer from accepted release base
  81793ac. Cold whole-file copies inherit the FUSE interactive context, and StorageFS.readdir
  defers the concrete NamespaceService listing until after that context exits. Add
  a reversible bulk scope around only copy_to_local and evaluate readdir during dispatch;
  prove real fake SSH pool reserve and bytes under Event-gated copies. This is a draft
  partial behavior package, not full foreground admission, dynamic worker growth,
  durability/reconciliation, or release acceptance. Full four gates, CLI, formal council
  and lead review remain integration requirements.
