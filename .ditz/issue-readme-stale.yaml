id: readme-stale
title: 'README.md is stale: install/test path, implementation status, Python version,
  missing LICENSE'
desc: 'README.md lags the code. Found while scaffolding the repo (2026-09-13):

  - Installation and Testing lead with setup-venv.sh / pip / plain pytest; the maintained
  path is the Nix flake plus the Bazel gate targets (see AGENTS.md ''Build and test'').

  - ''Implementation Status'' and ''Limitations'' list background sync workers and
  SSH/SFTP remote backends as not implemented; IMPLEMENTATION_STATUS.md and storage/backends/
  (ssh.py, rsync.py) show both are done.

  - ''Requirements'' says Python 3.7+; the flake and MODULE.bazel pin 3.11, and requirements.lock
  was compiled with 3.12.

  - ''License: See LICENSE file'' but the repo has no LICENSE file.

  Refresh these sections against the code and IMPLEMENTATION_STATUS.md, then drop
  the README caveat from AGENTS.md ''Repo specifics''.'
