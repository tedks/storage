id: storage171-partial-sync-quarantine
title: Quarantine partial-rename inode from sync
desc: PR171 target-present cache-only rename can leave an old DIRTY target row beside
  moved source bytes; queued SyncExecutor must not upload or mark CLEAN without namespace
  inode proof. Scoped in-memory repair on 5454f1d makes _should_sync_path reject namespace_uncertain;
  a real queue test observes no copy_from_local/CLEAN, while a test-local callback
  bypass causes an actual upload. No durable/restart claim.
