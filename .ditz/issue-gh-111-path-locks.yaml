id: gh-111-path-locks
title: Path-lock table and namespace RW lock for a multithreaded FUSE loop (threading
  stage 2)
desc: Threading stage 2 (docs/browsing_latency_plan.md D6, 4.4). Namespace RW lock
  (exclusive for directory rename and rmdir), refcounted per-path RLock table held
  across open/create/unlink/truncate/utimens/release upload, sorted two-path rename,
  eviction try-lock, watcher invalidation takes the path lock. Refetch pins and recheck
  marks safe under two openers; rename vs open of the old name. Deterministic unit
  races. Behaviour unchanged under nothreads.
