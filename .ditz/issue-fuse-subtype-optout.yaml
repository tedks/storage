- time: 2026-10-27T19:51:20-00:00
  who: Ted Smith
  what: commented
  comment: 'Question: should a mount with any remote member always be typed fuse.sshfs
    (current, PR #118), or should a profile key force it on/off? Case: an SSH member
    that is only a replica while reads come from local members loses thumbnails/indexing.
    Options: (a) always remote if any member remote [current]; (b) profile key subtype
    = auto|remote|local; (c) remote only if all/primary members are remote. Recommendation:
    (a) until a real complaint. Decides: Ted. Blocks: nothing (PR #118 ships (a)).'
- time: 2026-10-28T15:44:32-00:00
  who: Ted Smith
  what: commented
  comment: 'Ruling (Ted, 2026-10-28): optimize for the conservative case, option (a).
    Any remote member makes the whole mount remote (fuse.sshfs), as #118 ships. No
    opt-out key.'
