id: listing-bounded-cold-wait
title: Bounded cold wait for foreground listings
desc: 'Deferred from PR178 (docs/specs/live-union-listings.md, Interim bounds): the
  cold-partial slice keeps today''s foreground wait (per-member transport timeouts;
  a local member has none, so a hung local disk blocks a cold listing without bound).
  A bounded cold wait needs a late-result path; its required inputs are listed in
  the spec after the interim bounds (fencing that outlives the request, existing child-race
  policy, per-member supersession and observation time, no-snapshot case, interactive
  SFTP reserve held by a running foreground listing, single-member inline path). Numbers
  come with oq-listing-stale-serve-dir-mtime.'
type: feature
