title: 'GH #31: Align streaming default semantics between the CLI and StorageFS'
desc: 'Epic for https://github.com/tedks/storage/issues/31.

  StorageFS.__init__ defaults streaming_reads=False (fs.py:94) and so does mount_storage
  (fs.py:1214), while the CLI resolves to True (mount_profiles.py:603-605). The plan
  said default off first, on only after soak (docs/streaming_read_prefetch_plan.md:73,297).
  README does not mention streaming.'
