id: streaming-prefix-after-unlink
title: A failed session's prefix can bring back a name unlinked or renamed during
  the stream
desc: 'Council round 1 on #146 (Claude seat, pre-existing). An unlink (or a rename
  of the source) of a canonical path while a streaming session reads it deletes (or
  moves) the row; if the session then fails, the promotion sees no row and installs
  the prefix at the old name, bringing back a name the user removed. Row-less, so
  it never syncs or reaches a member. Fix sketch: unlink/rename detach the path''s
  session so failed cleanup drops the partial (the session''s detached flag already
  skips promotion).'
type: bugfix
