id: gh-29-unified-openssh
title: Share one OpenSSH connection across SFTP, watch, and rsync
desc: Parent issue https://github.com/tedks/storage/issues/29. Draft https://github.com/tedks/storage/pull/198
  proves one authenticated SSH connection with real SFTP, watcher and rsync traffic
  against MaxSessions=3. Implement the explicit OpenSSH transport policy, attach-only
  session lifecycle, and host-wide interactive reserve across all consumers described
  in .planning/unified-openssh-transport.md. Verify mounted traffic under load, server
  session limits, auth and proxy policy, master loss, and cleanup with Docker fixtures.
