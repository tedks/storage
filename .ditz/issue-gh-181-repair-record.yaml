  who: Ted Smith
  what: commented
  comment: 'Round 2 fixes at fd6dded on PR #182: rmdir/mkdir fence, exclusion before
    backend selection, never-drop record retries, EIO when a partial rename''s record
    is not yet written. Index-only record escalated to the CTO (MSG-rrs-20261118c).'
- time: 2026-11-18T05:21:28-00:00
  who: Ted Smith
  what: commented
  comment: CTO ruling C (2026-11-18). Authorize xattr metadata specifically for pending
    member-rename repairs. SQLite is a rebuildable projection. Both endpoint names
    and stable member/repair identity must survive fresh-index recovery with no cached
    leaf and the member offline. Restore protections before any worker can upload,
    rename or evict. Prove crash ordering, storage/capacity failure, durable resolution,
    old-index handling and a fresh-index regression that loses these protections on
    the index-only design. The earlier no-schema restriction is lifted only for this
    feature. This neither selects future replication configuration nor settles first
    synchronous member rename semantics. Required before accepting PR182; a bare journal
    would require a separate change to the authority contract.
- time: 2026-11-18T06:07:13-00:00
  who: Ted Smith
  what: commented
  comment: 'PR #182 council converged: round 8 (19bef2948267-20261118T060339Z-31e39f)
    CLEAN for Anthropic and OpenAI, Google EMPTY (usage limit). Rebased on master
    4989ba7 as 3a2123a with a byte-identical PR diff. Final gates wait for #168, then
    a rebase, then a formal round on the exact head and an independent lead review
    (CTO STORAGE-182-FULL-I).'
- time: 2026-11-18T06:33:34-00:00
  who: Ted Smith
  what: commented
  comment: 'Integration with #180: its admission bypass for flush was approved only
    for the inherited fusepy no-op. The #182 change at 010b498 defines a stateful
    StorageFS.flush for fenced writable conflict views. On the combined head classify
    the real handler as demand, retain the exact close error and cleanup semantics,
    and replace the inherited-no-op premise with a cap-enabled contention/error regression.
    Verify cap-off behavior as well. #180 can integrate independently on its reviewed
    base.'
- time: 2026-11-18T06:51:52-00:00
  who: Ted Smith
  what: commented
  comment: 'CTO / #167 overlap on 435b958. The never-drop repair retry sleeps inside
    a sync worker. Verify with one worker that healthy unrelated file bytes sync during
    failed record persistence and backoff; on recovery retain exactly one logical
    repair and perform no member rename. #182 owns the fixed-pool regression and fix.
    #167 owns the saturated growing-pool case and retirement after recovery. In-worker
    delay is verified; indefinite starvation is not yet established.'
- time: 2026-11-18T06:56:52-00:00
  who: Ted Smith
  what: commented
  comment: 'At c75d1a7 the one-worker regression is reported green. _requeue_after
    creates a new Timer thread per delayed retry and increments unfinished_tasks before
    Timer.start; if thread creation fails the task and its completion accounting can
    be stranded. Cover bounded resource use on a burst and stop/restart accounting;
    verify unrelated member bytes before retry release. #167 corrects a four-caller/three-party
    rendezvous separately.'
- time: 2026-11-18T07:07:57-00:00
  who: Ted Smith
  what: commented
  comment: 'CTO at 816fab8: accept actual cache metadata exhaustion after successful
    conflict-view flush as a narrow residual, with exact local bytes retained at a
    logged recovery path and member untouched. Excludes representation limits, metadata-only
    dedup of different bytes and avoidable alias overwrite. Preserve valid rename
    paths beyond 3584 serialized bytes using versioned carrier storage with compact
    xattr and compatible reads; account for oversized view-write metadata without
    displacing user bytes. C3 stands for supported queued RENAME: order publication
    with overlapping member calls, preserve disjoint progress, and fix the split snapshot
    of durable and pending repairs across handoff. Require barrier, long-path/rebuild
    and fault regressions. Scheduler changes received; final council, lead and full
    gates pending.'
- time: 2026-11-18T07:23:30-00:00
  who: Ted Smith
  what: commented
  comment: At dbeaa65, three remaining integration findings were sent to the lead.
    An initially fenced member excluded from mutation registration can become eligible
    after external resolve and miss a second fence before the member call. A failed
    unlink or interrupted cleanup can leave a writable alias of the kept view bytes;
    path truncate still opens it for mutation. Missing version-2 sidecar data currently
    makes carrier_path report metadata JSON as the recovery bytes. Cover ordering,
    alias survival and explicit missing-payload reporting on the final reviewed head.
- time: 2026-11-18T07:32:52-00:00
  who: Ted Smith
  what: commented
  comment: 'Review at fddd4f1: resolve/re-fence registration, missing recovery payload
    display and truncate alias guard are implemented. Two open-time hazards remain:
    check the live recovery payload and the alias refer to the same inode before unlinking;
    stored dev/ino can be reused when the payload is missing. The sweep must distinguish
    the correct conflict view from ordinary or differently resolved member-suffixed
    files, preserve ambiguous names, and stay within the cache through changes in
    ancestor type. Requested synthetic reopen coverage. PUBLISH_WAIT is per attempt,
    not a queue latency guarantee.'
