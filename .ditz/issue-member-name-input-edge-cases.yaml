id: member-name-input-edge-cases
title: Resolve ambiguous relative path and case/length edge cases for member names.
desc: 'Deferred nits from PR #166 council: NAME=SPEC intentionally recognizes explicit
  names only when SPEC starts ssh://, rsync://, /, ./, ../ or ~/ to preserve some
  legacy relative paths containing =. Inputs such as ssd=data can therefore be interpreted
  as bare relative paths. A bare legacy path foo=/bar is ambiguous with an explicit
  name and changes interpretation. Also choose whether to limit name length and reject
  casefold duplicates, given conflict filenames and possible case-insensitive backing
  filesystems. Keep compatibility and user-facing error behavior explicit; this is
  not a reason to bypass PR #166''s Important suffix ruling.'
