id: gh-63
title: 'GH #63: Fall back to the next replica when a read transfer fails'
desc: 'Epic for https://github.com/tedks/storage/issues/63.

  Keeper of the #62/#63 pair. _ensure_file_in_cache picks one member (fs.py:644);
  if cache_file returns False (cache.py:271-274) it goes to recompute and then ENOENT
  (fs.py:839-840). get_backend_for_read builds the full candidate list and returns
  only the first (replication.py:132-134). The rsync motivation in the issue is out
  of date (reads use SFTP since PR #73), but the gap applies to any transfer failure.'
type: bugfix
component: default
