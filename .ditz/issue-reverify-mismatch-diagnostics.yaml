id: reverify-mismatch-diagnostics
title: Make checksum re-verification mismatch logs identify evidence without asserting
  a rewrite
desc: 'Source81793ac fs.py1114 logs only backend ID and asserts rewritten without
  size/timestamp change. It actually knows a current remote digest differs from a
  persisted digest under the same reported stat basis. Persisted hashes can originate
  from inferred upload success, not just previous remote hashing (gh-112-rsync-quickcheck).
  User supplied many remote2 messages; missing path/identity, old/new digest and record
  age/provenance prevent distinguishing many files from repeated one-file failure.
  Proposed change: accurate checksum-mismatch wording, member label/stable ID, privacy-conscious
  opt-in path or per-mount correlatable identity, old/new hash prefixes and prior
  record age; provenance where known, unknown explicitly. Tests should distinguish
  skipped upload, true remote overwrite and persistence failure without downloading/live
  files. Avoid claiming these logs establish corruption or current external rewrites.
  No implementation or runtime evidence yet; source audit only. Parent sync fix remains
  gh-112-rsync-quickcheck.'
