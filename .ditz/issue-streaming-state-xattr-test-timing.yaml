id: streaming-state-xattr-test-timing
title: test_streaming_state_xattr_tracks_progress is timing-dependent (failed on splinter1)
desc: 'On splinter1 (Ubuntu 26.04, first field-test host) the fast gate failed once
  in tests/test_fs_streaming.py::TestFSStreamingIntegration::test_streaming_state_xattr_tracks_progress
  with AssertionError: ''prefetching'' != ''complete'' while the other 320 sandboxed
  tests passed. The assertion reads the stream-state xattr before the background prefetch
  has finished on a slower or differently scheduled host. The test should wait for
  the terminal state with a bounded poll instead of asserting after a fixed delay.'
type: bugfix
component: tests
