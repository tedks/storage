id: member-attribute-copy-policy
title: Configure attribute copying with full metadata preservation by default
desc: Configure which member attributes are copied. Default to copying everything
  supported, including arbitrary xattrs and ACLs. Specify per-backend capabilities,
  how to handle unsupported attributes, and how mount-internal metadata and identity
  translation are kept separate.
