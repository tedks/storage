id: adaptive-sync-cleanup-error-context
title: Preserve the original worker-start error if cleanup also raises
desc: 'Formal PR #167 council final-round Nit. `SyncManager.start()` calls `stop()`
  inside its exception handler. If cleanup itself raises, Python chains the original
  start failure as context but reports the cleanup failure first. Low likelihood and
  the original is still visible; follow up by logging cleanup failure while re-raising
  the original, with a synthetic test. Does not block PR #167.'
