id: gh-91-tmpfile-leak
title: Remove the conflict-check temp file when the download fails
desc: 'conflicts.py:82-103: when copy_to_local raises, the NamedTemporaryFile is never
  unlinked because the unlink at :94 is skipped by the except at :99. Use try/finally
  or a context manager, and add a regression test for the failure path. See issue
  #91.'
