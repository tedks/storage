  comment: '3. (Claude seat, rebase-resolution round) Eviction churn: when evictions
    under cache pressure keep bumping a directory''s listing generation, every listing
    of it is raced; if the directory has no earlier dir_cache entry, nothing is stored
    and a later member failure has no names to fall back on. A corner of #115''s ''raced
    listing is not published'' rule, not a correctness bug. See also gh-111-child-invalidation-churn,
    whose per-name fix would cover it.'
