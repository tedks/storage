  comment: 'Council nit on PR #122 (Claude seat). A contributor with no Docker host
    has no recorded way to say the remote gate was skipped except running the three
    local gates by hand. Counter: Ted''s intent is that skipping must be deliberate;
    an opt-out env var (e.g. STORAGE_REMOTE_GATE_SKIP=1) that runs the local three
    and prints a loud ''remote gate NOT run'' would be the deliberate path. Needs
    a product call, so not done in the PR.'
