title: Investigate unchanged ssh mux test failure in PR175 fast gate
desc: On PR175 rebased source 50418327de1af6822955d6d72b138753c591ec34 against published
  master 66c640a, forced unfiltered //:storage_tests_fast_gate executed 40 targets,
  39 pass and //tests:storage_test_ssh_mux fails test_a_replaced_socket_directory_is_not_trusted.
  assertLogs captures no warning; a warning from ControlSockets.close appears later
  in teardown. Neither tests/test_ssh_mux.py nor storage/backends/ssh_mux.py differs
  from master. Investigate and repair on an authorized gate prerequisite branch; rerun
  exact-head gate. PR175 owner cannot edit those files under current narrow scope.
