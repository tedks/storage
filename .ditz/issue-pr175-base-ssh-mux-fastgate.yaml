  what: commented
  comment: 'Implementation lane on fix/ssh-mux-directory-type-20261112 at base 66c640a.
    Deterministic regression now forces the replacement symlink''s lstat result to
    reuse the original directory''s device/inode while retaining symlink mode. Control-red
    evidence: `//tests:storage_test_ssh_mux --test_arg=-k --test_arg=test_a_replaced_socket_directory_is_not_trusted
