id: gh-181-sync-rename-noreplace
title: First synchronous member rename still replaces an occupied target
desc: 'NamespaceService._propagate_dir_operation calls Backend.rename (os.replace
  / posix-rename) during the mount''s rename. An unrelated object at the member target
  is replaced. Needs a no-replace member rename (renameat2 RENAME_NOREPLACE locally;
  SFTP plain rename / hardlink for files on OpenSSH) and a repair record when it refuses.
  Out of scope for PR #182.'
type: bugfix
