desc: 'PR #180 council round 4eda9439791b-20261118T054231Z-a2e05f nits (OpenAI seat),
  deferred to keep the gated head frozen: (1) README Status says the demand reserve
  covers ''fsync on cached files'' but fsync is demand on every descriptor (a local
  fsync, never member I/O); (2) storage/foreground_admission.py module docstring ''a
  slot holder can wait on a path lock, never the reverse'' should say StorageFS path
  lock, since a callback waiting for admission can hold a libfuse path lock (the preceding
  paragraph says so). Also the independent review''s cosmetic line break at foreground_admission.py:34-35.
  Doc-only.'
