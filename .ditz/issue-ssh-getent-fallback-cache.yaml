  comment: 'A member holds one transport (PR #132), so getent runs once per connect
    or retry window, not per FUSE thread; the cost premise is gone. A cache would
    be stalest exactly when a reconnect follows an address change, which the #124
    ruling not to cache already guards against. Reason recorded in storage/backends/ssh.py
    beside the fallback.'
