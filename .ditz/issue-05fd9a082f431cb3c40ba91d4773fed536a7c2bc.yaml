  what: commented
  comment: 'Observed on framework0 (coreutils 9.4) on master 80625c2 and 8edacc5 alike:
    ls -la on the mount prints ''ls: <path>'' with no strerror for every entry, stdout
    fine. Likely FUSE getxattr (security.selinux/ACL) returning an errno for uncached
    entries that libacl/ls does not map. Not caused by #113; unverified root cause.
    Repro: mount, ls -la a remote-only dir, read stderr.'
