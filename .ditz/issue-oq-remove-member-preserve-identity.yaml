id: oq-remove-member-preserve-identity
title: Decide how to remove a numbered member without renaming later members.
desc: 'PR #166 council nit: a profile that used remote0,remote1,remote2 cannot simply
  remove remote1 while retaining remote2 under the current numbered-name count guard.
  Existing bare-member behavior already shifts identities when a member is removed,
  so this is not a regression from PR #166. Options: allow explicit numbered gaps
  with an index/profile identity guard; require migrating all remaining members to
  descriptive names first; or keep removal unsupported. Recommendation: design an
  explicit identity migration and persist a member registry before loosening the guard.
  Ted decides. Does not block PR #166''s current draft unless removal is in scope.'
type: task
component: open-questions
