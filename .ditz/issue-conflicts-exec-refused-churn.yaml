id: conflicts-exec-refused-churn
title: A member that refuses exec requests re-queues view hashes and probes at every
  listing
desc: 'PR #140 round 4 (Claude nit): exec_command raising SSHException gets the PROBE
  verdict, so is_connection_error is True and the copy is never marked unverified;
  each listing re-queues and probes. Cheap churn; mark unverified after N consecutive
  refusals if exec-less members are in scope.'
