id: remote-gate-always
title: 'Make the remote gate mandatory: all-gates suite, scripts/run-gates.sh with
  framework0 fallback, AGENTS.md'
desc: Ruling on oq-remote-gate-push-policy (2026-10-27). Add a manual test_suite covering
  fast, mounted, resilience and remote gates; scripts/run-gates.sh runs it locally
  when Docker is usable, otherwise ssh framework0, check out the exact SHA (pushed
  branch) in a scratch worktree, run the remote gate there and clean up. Update AGENTS.md
  'Build and test' and 'The remote gate'.
