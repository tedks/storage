id: oq-listing-file-monitor-bridge
title: Decide whether to support an opt-in desktop listing monitor
desc: 'The scratch capability probe in PR #193 showed that stock GIO and Nautilus
  miss native FUSE late additions. A small client-side monitor bridge delivered a
  late row in the original file URI on installed Nautilus. Production support would
  add an opt-in client component and restart, plus an authenticated and bounded revision
  transport. Record the decision on whether that client scope is authorized.'
