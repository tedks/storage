id: gh-181-location-rows
title: Location rows name the member at the new path after a missed rename
desc: 'rename_path moves file_locations rows for every member, including one whose
  member rename failed and is now left for repair (PR #182). The index then overcounts
  replicas and may read the new name from a member that lacks it. Decide whether to
  drop the failed member''s rows under the new path, given re-replication would upload
  onto a possibly occupied target.'
