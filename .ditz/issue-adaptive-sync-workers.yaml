id: adaptive-sync-workers
title: Scale background sync workers to a bounded configurable maximum when distinct
  tasks queue; preserve configured minimum, foreground SSH capacity, and clean shutdown.
  Track synthetic concurrency and gate evidence in this issue.
desc: Background sync currently starts a fixed `workers` count (default 2), even when
  many distinct sync tasks queue. Add opt-in demand scaling without overloading shared
  SSH sessions. This task excludes foreground FUSE request threading, live mounts,
  deployment, and hosts.
