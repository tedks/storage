id: gh-207-streamed-refresh-last-good
title: Keep the last good copy through a discarded streamed refresh
desc: 'Follow-up owned against #204 (CTO-208-PRIVATE-STAT, narrow limitation of #208):
  with streaming on, a read-only open of a changed cached CLEAN file drops the copy
  and streams it again, as before #208; if that stream is discarded (the member changed
  or could not be confirmed), the CLEAN entry is gone and is fetched again at the
  next open, rather than serving the last good copy. A possible shape without a second
  generation subsystem: serve the still-named last-good copy to the opener and run
  the verifying refresh in the background, replacing it only when verified.'
type: feature
component: storage
