id: sparse-positional-write-extent-cost
title: Measure cache-lock latency of sparse positional writes
desc: 'PR #191 uses a whole-inode data-extent walk under the shared cache lock when
  a positional write to a sparse named file cannot establish the capped block delta
  from the written span alone. Measure the effect on a different file''s read/allocation
  using a synthetic highly fragmented sparse file. If the cost is material, avoid
  repeating full walks while keeping the written charge equal to an independent named-cache
  scan after growth, overwrite and truncation. Scope this work to ordinary named inodes
  and preserve held-descriptor and eviction correctness.'
type: task
component: default
