id: pr179-release-monitor-fuse-scratch
title: Bound PR179 release monitor without traversing synthetic FUSE
desc: 'PR179 frozen no-args gate on 00082c4 stopped after 312.43s with a generic scratch/free-space
  monitor read failure. The external run-bounded.py recursively scanned /tmp/s179.T4d6oF
  while synthetic FUSE mounts lived below it, with no mount boundary guard. It conflated
  a three-second scanner deadline, lstat/scandir failures and df failure/parse into
  one message, so the exact cause of that stop is UNKNOWN. The scanner''s last total
  cannot be asserted as owned scratch if it traversed virtual mount data. Two separate
  LocalBackend FUSE ENOENT test failures are tracked by storage-mounted-readiness-initial-members;
  neither is attributed to the monitor.


  Acceptance: a reviewed monitor that never descends a mounted tree across mount races;
  accounts for ordinary owned temp scratch and explicitly identifies excluded/unknown
  allocation; separates scanner deadline/errno/path from df timeout/exit/parse; bounds
  helper and scope stop waits; reports nonempty cgroups without claiming release.
  Preserve old wrapper/logs/hashes. Proposed unexecuted v2 source and exact synthetic
  tests live in the PR179 private run state, monitor-v2-review.md. A fresh root-issued
  runtime envelope is required before any test. If a hard total including open-unlinked/hidden-underlay
  bytes is required, establish an independently bounded test temp filesystem/quota
  rather than claiming a name walk proves it.'
type: bugfix
