id: gh-107-preserve-host-keys
title: Prevent system SSH from pruning trusted host keys
desc: 'Child of GitHub #107. Explicitly set UpdateHostKeys=no in RsyncBackend and
  RemoteWatcher system SSH commands so an already trusted key remains recorded when
  a backend sharing a hostname advertises a different set. Test both builders with
  synthetic inputs; document why the setting is explicit even with a custom known-hosts
  file. This task does not add a configurable known-hosts path or strict verification
  and must not close #107.

  Owned by fix/ssh-hostkey-update-policy lane. No live mount, remote host, personal
  SSH store, deployed configuration, or service access.'
