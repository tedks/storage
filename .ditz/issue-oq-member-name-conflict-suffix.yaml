id: oq-member-name-conflict-suffix
title: Choose a safe namespace policy for descriptive storage member names.
desc: 'PR #166 formal council found that a member named jpg makes ordinary /photo.jpg
  resolve as a conflict view of /photo, and listing can suppress the real file. Existing
  remoteN suffixes already reserve paths, but arbitrary descriptive names broaden
  the collision surface. Options: (A) require distinctive member- or remote-/local-
  prefix and document residual suffix reservation (recommended bounded change for
  PR #166); (B) redesign conflict filename disambiguation and escaping (larger change);
  (C) allow any ASCII name, document suffix reservation (accepts ordinary file inaccessibility
  risk). Ted decides. Blocks council clearance and merge of PR #166. No live member
  data was inspected.'
type: task
component: open-questions
