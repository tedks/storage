id: oq-conflict-no-remote-hash
title: Decide pre-sync conflict handling when a member cannot provide a remote checksum
desc: 'Product ruling for GitHub #74 and ditz gh-74-no-hash-policy, from the 2026-11-10
  performance audit (docs/performance_backlog_2026-11-10.md, pinned master a7467c6).


  Question: When remote xxh128sum is unavailable or times out, should pre-sync conflict
  detection block the upload with an explicit unverified/error state, or download
  the member file under a strict size/time budget to compare it? Current conflicts.py
  downloads the whole member file and on exception assumes no conflict, which may
  allow an overwrite without verification.


  Options: (A) fail closed and retry when remote hashing is unavailable; this can
  leave a member DIRTY indefinitely until tooling is installed or policy changes.
  (B) bounded download fallback; this preserves sync progress for small files but
  needs a limit and can still consume bandwidth. Recommendation: A by default to serve
  the no-silent-loss design goal, with any optional bounded fallback separately specified
  by Ted. Decision owner: Ted. Blocks acceptance of gh-74-no-hash-policy and the proposed
  no-download conflict-check package. No implementation is authorized by this issue
  alone.'
type: task
