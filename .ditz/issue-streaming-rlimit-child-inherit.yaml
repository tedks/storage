id: streaming-rlimit-child-inherit
title: Raised RLIMIT_NOFILE soft limit is inherited by child processes
desc: 'From council on #190 (round-2 Anthropic nit). mount raises soft RLIMIT_NOFILE
  to the hard limit; recompute commands, ssh/rsync, the watcher and the ssh mux inherit
  it, and select(2) users break on descriptors >= 1024. There is no central spawn
  point (subprocess fork_exec runs no Python at-fork hooks); #190 documents it. Fix:
  pass a preexec/restore through a shared spawn helper.'
