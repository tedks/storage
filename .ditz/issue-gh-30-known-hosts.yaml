id: gh-30-known-hosts
title: Load known_hosts and apply the policy
desc: 'Load the known_hosts file(s) in _connect, map the policy onto Paramiko''s policies,
  and set the rsync and watcher ssh options to match so strict mode cannot be bypassed.

  From https://github.com/tedks/storage/issues/30.'
