    waits for all three members with no deadline. raid and chunk1 were not inspected;
    which member or queue dominates is unverified. Next: per-member listing timing
    at debug, or a read-only ps on drynwyn during a cold listing, to check for checksum
    processes.'
- time: 2026-11-12T19:27:37-00:00
  who: Ted Smith
  what: commented
  comment: 'Correction 2026-11-12 (root review of PR #177 at 93ed39f): the slow readdir
    was first observed, not proven cold, and its time is not attributed to raid, chunk1
    or channel queueing; those, checksum scheduling, the merge and Python/FUSE overhead
    are unmeasured hypotheses. 81793ac already reserves 1 SFTP channel per member
    for interactive requests; unaccepted #175 fixes cold copies holding interactive
    leases.'
- time: 2026-11-19T20:17:50-00:00
  who: Ted Smith
  what: commented
  comment: 'Repeat field report at 0fa941f: some larger directories intermittently
    appear to hang. The daemon stayed up. Four one-second samples each showed four
    outstanding FUSE requests for the mount. The count includes in-progress operations
    and supplies no opcode, so it cannot identify readdir, a member, or a network
    drop. No directory was opened for the probe. On this head a cold/invalidated foreground
    readdir waits on all member futures without a total deadline. One executor per
    member serializes different directories, and concurrent foreground requests for
    the same uncached directory each enqueue another scan. See listing-bounded-cold-wait
    and listing-foreground-single-flight. Regress with a synthetic paginated large
    listing plus a stalled member, repeat and concurrent opens, a fast unrelated directory,
    and a late result racing invalidation. Measure directory enumeration separately
    from a file manager''s later getattr/preview work, with filename-free counts and
    latency by stage.'
- time: 2026-11-19T20:34:48-00:00
  who: Ted Smith
  what: commented
  comment: 'Opt-in progressive listings are in draft #194 (cdc7697), atop the preview
    accounting fix in #192. A real mounted test with 1,024 entries on a fast member
    returns before a held member, then includes the latter on re-enumeration after
    release. Both FUSE loop modes fail with progressive dispatch disabled and pass
    enabled. The full 49-target suite passed. This is filesystem re-enumeration; #193
    records separate GIO/Nautilus feasibility evidence. No claim that this isolates
    the reported field stall.'
