id: ssh-mount-host-transport
title: Share a Paramiko host session across a mount's compatible member roots
desc: 'Share SFTP and Paramiko exec capacity per authenticated identity, preserve

  member-specific filesystem behavior, and verify authentication, reserve,

  failure recovery and unmount against synthetic roots on real sshd.

  The OpenSSH watcher and rsync transport follow-up is a separate lane.'
