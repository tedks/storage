  comment: Ted ruling on Storage resumption, 2026-11-17. On a cold listing, expose
    the available union even when a member fails and the result is empty. Include
    available local names. Log missing members and retain internal failure information.
    No partial UI indicator or proven desktop notification is required. This ruling
    addresses partial availability.
