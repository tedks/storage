  what: commented
  comment: 'Ted ruling 2026-11-13: "EAGAIN is a good pick, but this should be a mount
    option and I''d like it to default to off so we can just let the queue drain."
    Root interpretation: bulk-capacity wait expiry is opt-in via a mount option; default
    timeout disabled means wait for queue capacity, with cancellation/shutdown still
    effective. Enabled timeout expires with EAGAIN, never ENOENT. This is a queue-admission
    policy, not removal of underlying SSH operation/network timeouts. Product question
    answered; config plumbing, tests, reviews and release gates remain outstanding.
    No deployment claimed.'
