id: oq-pr175-bulk-timeout-errno
title: Choose errno for foreground cold-copy bulk wait expiry
desc: 'Question: when a healthy SSH member has an existing file but a foreground cold
  full-copy exhausts bulk_wait behind sync/bulk leases, what errno should FUSE open
  expose? Options: retain existing fetch-failure ENOENT mapping (minimal code but
  misleading missing-file signal); return EAGAIN for transient capacity (recommended
  if caller retry semantics are acceptable); return EIO for unavailable transfer (less
  likely to be mistaken for absence). Decider: Ted/product owner. Blocks a deliberate
  release contract for PR175 cold-open contention; does not authorize changing errno
  in the narrow tracer. Current synthetic test observes ENOENT on 16fa46d, but no
  live behavior or product ruling is inferred.'
