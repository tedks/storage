id: streaming-partial-cache-budget
title: Evict on partial download growth rather than its advertised file size
desc: Opening a sparse partial charges its declared length and can trigger eviction
  or refusal before reading any bytes. Charge materialized ranges as they consume
  cache space. Evict eligible files in demand-access order only at pressure, preserve
  open, dirty and repair-pinned copies, and continue demanded reads without retaining
  them if no victim is eligible. Verify in disposable full-cache mounted cases, including
  concurrent fills, cleanup, repeated and distant reads.
type: bugfix
