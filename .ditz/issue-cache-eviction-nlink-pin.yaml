id: cache-eviction-nlink-pin
title: A cached copy with st_nlink>1 after a failed partial unlink is never an eviction
  victim until restart
desc: 'From council on #191 (round-1 Anthropic N6). _evict_if_still_clean skips st_nlink>1
  copies so it never claims bytes that unlinking one name would leave allocated. A
  partial whose unlink failed after install therefore pins its cached file until the
  startup sweep. Fix: retry the partial unlink in streaming cleanup.'
type: bugfix
component: cache
