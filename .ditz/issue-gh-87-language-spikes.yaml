id: gh-87-language-spikes
title: Run language spikes against the core boundary only
desc: 'Step 4 of ''What to do later'' in https://github.com/tedks/storage/issues/87:
  spike against the defined core API, not the existing Python FUSE surface.

  Carries the deliverables from the closed Phase 7 umbrella #20 (docs/refactor_roadmap.md:148-163):
  produce benchmark and complexity data per candidate language, and a recommendation
  that includes a rollback plan. #20''s hot-path framing is superseded by #87''s adapter
  split, and the roadmap''s Phase 7 section still describes the old framing.'
