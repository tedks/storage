  comment: 'Council round 1 on #141 (Claude seat): the bad case is an unreachable
    SSH member: the upload holds the upload lock for the SFTP timeout, once per target
    member, and with the single-threaded loop a rename or unlink of a freshly written
    file stalls the whole mount that long. Include it in the measurement.'
- time: 2026-10-30T17:11:04-00:00
  who: Ted Smith
  what: commented
  comment: 'Council round 3 on #141 (Claude seat): a directory retry for a member
    whose down window has just passed takes the path guard and starts a reconnect,
    holding the namespace lock shared for up to one connect timeout, once per window.
    Bounded; include it in the measurement.'
