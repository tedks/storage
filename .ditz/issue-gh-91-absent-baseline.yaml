id: gh-91-absent-baseline
title: Handle an absent checksum baseline as its own case in check_conflict
desc: 'Distinguish ''no recorded checksum'' from ''remote changed'' in ConflictDetector.check_conflict,
  matching the class docstring (conflicts.py:34-37) and the no-trusted-baseline handling
  #81/PR #85 added on the reprobe side. Decide the semantics for an absent baseline
  (adopt remote, treat as clean, or force a checksum) before coding.'
