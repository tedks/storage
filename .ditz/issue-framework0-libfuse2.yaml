  what: commented
  comment: 'Council round 2 (Claude) note: after installing libfuse2t64, an already-open
    nix develop or direnv shell (and any nix develop nested inside it) keeps the nixpkgs
    FUSE_LIBRARY_PATH it exported, because a non-empty preset value wins. Open a fresh
    shell or run direnv reload. The banner''s libfuse2: line shows which library is
    in use.'
- time: 2026-09-15T01:37:30-00:00
  who: Ted Smith
  what: 'closed: wontfix'
  comment: 'Operator decision (2026-09-14): keep libfuse 2 in Nix and do not install
    libfuse2t64 on framework0. Accepted risk: framework0 loads nixpkgs'' libfuse.so.2
    into Bazel''s host-glibc Python, which needs GLIBC_2.38 at the PR #92 flake.lock
    (host has 2.39). If a flake.lock bump raises that floor, the gates fail with "version
    GLIBC_2.xx not found". Fix it inside Nix, not on the host, e.g. take fuse2 from
    a nixpkgs input whose glibc floor the host meets, or run the tests with a Nix-provided
    Python.'
