  comment: 'Council round 2 (Claude) note: after installing libfuse2t64, an already-open
    nix develop or direnv shell (and any nix develop nested inside it) keeps the nixpkgs
    FUSE_LIBRARY_PATH it exported, because a non-empty preset value wins. Open a fresh
    shell or run direnv reload. The banner''s libfuse2: line shows which library is
    in use.'
