id: mounted-sftp-pool-recycle
title: Prove quiescent single-member SSH pool recycle
desc: Follow-up from docs/mounted_restart_design_2026-11-11.md, P1. Build a narrow
  internal admission/drain/reconnect boundary for one SSH member transport across
  both SFTP leases and exec channels, including connection attempts and nested leases.
  StorageFS, FUSE, cache, index, descriptor map, sync policy, and mount lock remain
  live. Do not call mark_down or close on an active channel. On timeout or cancellation
  before retirement, preserve the old pool and reopen admission. Synthetic tests must
  cover active foreground read, streaming range, sync upload with overlapping local
  write, blocked new lease and exec channel, hung watchdog request, reconnect failure,
  and dirty-generation preservation in both FUSE loop modes where mounted tests apply.
  Stop if channels cannot be counted/fenced or a bounded unwind cannot be proven.
  Operator command and watcher/rsync restart are separate scope.
type: task
component: mount
