id: fuse-mount-fixture-sigpipe
title: tests/fuse_mount.py run_fuse leaves SIGPIPE at its default after unmount
desc: 'Council on PR #142 (Claude seat nit). run_fuse calls FUSE() on a mount thread,
  where mount_storage''s SIGPIPE guard cannot run (signal.signal is main-thread only),
  so every mounted test leaves the test process''s SIGPIPE at its default after unmount
  (libfuse 2 resets it). A later test in the same process that writes to a dead socket
  could exit 141. Fix: run_fuse restores SIG_IGN after teardown, as the remote gate''s
  mount fixture already does.'
