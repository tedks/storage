id: descriptive-remote-names
title: Allow stable, descriptive storage member names in mount profiles and explicit
  CLI inputs while preserving legacy ordinal identities for unchanged profiles. Validate
  names and collisions; document identity migration boundary; add synthetic regression
  coverage.
desc: Stable member names should flow through mount, conflict views, policy, and reprobe.
  Existing unnamed configurations must retain remoteN/localN identities. No live data
  inspection or migration in this task.
