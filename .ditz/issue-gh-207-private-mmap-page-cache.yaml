id: gh-207-private-mmap-page-cache
title: Private-handle MAP_PRIVATE mixes pages with buffered readers
desc: 'From #208 round 5 (L-I3, S8), confirmed mounted (tests/test_sync_system.py
  test_mmap_of_a_private_handle, both loop modes). A private (direct_io) handle''s
  MAP_PRIVATE mapping is filled through the inode''s one page cache using the private
  fh; a buffered reader of the installed copy opened beside it then reads the private
  copy''s bytes (and vice versa). FUSE has no mmap callback to refuse it.

  CTO-208-MMAP-FALLBACK supersedes private full-fill handles: after bounded attempts,
  a cold CHANGED or UNCONFIRMED full fill returns EAGAIN for both readers and writers.
  Keep the reproduction at 1334047f9323697bbaa9b1275452d301dc7e169c and the replacement
  regression in tests/test_sync_system.py, which exercises buffered read and mmap
  on the verified same-size/mtime replacement in both FUSE loops.


  Before offering private fills again, prove that their pages are isolated across
  versions and from the ordinary buffered path. Use independently identified FUSE
  inodes or an equivalently proven mechanism. Exercise overlapping private mappings
  in both orders, with both equal and different lengths, plus buffered reads and mappings
  of the verified replacement. Include mappings that outlive their originating descriptors
  and run in both FUSE loops. Path-level admission or direct I/O alone is insufficient
  while pages remain shared.'
type: bugfix
component: storage
