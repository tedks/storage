id: gh-207-private-mmap-page-cache
title: Private-handle MAP_PRIVATE mixes pages with buffered readers
desc: 'From #208 round 5 (L-I3, S8), confirmed mounted (tests/test_sync_system.py
  test_mmap_of_a_private_handle, both loop modes). A private (direct_io) handle''s
  MAP_PRIVATE mapping is filled through the inode''s one page cache using the private
  fh; a buffered reader of the installed copy opened beside it then reads the private
  copy''s bytes (and vice versa). FUSE has no mmap callback to refuse it. Partial
  prevention: give every open of a path direct_io while a private handle is open on
  it, and refuse (EAGAIN) a private open while a buffered handle is open; two private
  handles with MAP_PRIVATE would still share the cache. CTO to choose; documented
  in README item 7 meanwhile.'
type: bugfix
