id: oq-mounted-sftp-maintenance-semantics
title: Rule on mounted SSH member maintenance request semantics
desc: 'Design: docs/mounted_restart_design_2026-11-11.md (source snapshot 66c640a).
  Decision owner: Ted (product ruling). Choose behavior for new SFTP or exec requests
  to a member while its SSH pool drains: bounded wait with explicit deadline, or prompt
  retryable error. Decide whether a maintenance request must refuse when an active
  streaming read, sync upload, or exec command exceeds that deadline. Recommendation:
  bounded wait, then report not restarted without closing an active channel; never
  promise zero latency or automatic replay of an unknown remote mutation. This blocks
  the operator-facing P2 command and final user-visible contract, not source-only
  P1 tests.'
