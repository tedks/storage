- time: 2026-10-30T19:45:06-00:00
  who: Ted Smith
  what: 'closed: fixed'
  comment: 'Fixed by PR #153 (merge 2a34990). Not StorageFS.destroy: another mount
    namespace (e.g. a Bazel linux-sandbox) held a copy of the mount, so after fusermount
    -u the kernel never aborted the FUSE connection and destroy was never entered.
    Still reproduced 3/10 on master after #130 and #143. Test-side teardown now releases
    the loop; regression test in the mounted gate. Product-side version: d88007.'
