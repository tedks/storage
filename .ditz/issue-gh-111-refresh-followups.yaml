  comment: 'PR #135 round 3 (Claude nit): under fuse_threads there is no single flight
    for foreground listings: N threads on one expired directory each submit a full
    member listing, run one after another on the per-member executors. Later readdirs
    could wait on the listing already in flight. Also no test runs the listing paths
    with fuse_threads on.'
