id: field-gio-content-sniff-per-entry
title: Measure what a wide (Nautilus-like) GIO attribute request costs on a Storage
  mount
desc: 'Field report 2026-11-12, splinter1, 81793ac: docs/field/splinter1-browse-20261112/REPORT.md
  (PR #177).


  Measured:

  - On the 700-entry Music root, GIO with listing-level attributes took 0.9-1.2 s
  on Storage (later runs) against 0.19 s over GVFS SFTP to chunk0.

  - strace of the Storage listing: 700 statx and 703 access calls; attr_timeout is
  0 by design.


  Unplanned, one sample:

  - With standard::*,time::*,unix::*,access::*, the same listing took 94 s on Storage.
  It ran outside the probe bounds (over the 30 s limit and the prefix-read limit).

  - What it read, wrote or cached is unknown.


  Hypothesis, not verified: standard::content-type may make GIO''s local backend read
  the start of each regular file, so each one becomes an open of a likely uncached
  file through Storage. GVFS SFTP''s behaviour for the same attributes was not checked
  or measured.


  This is a lead for the reported Nautilus delay before a directory shows anything.
  It is not a diagnosis.


  Next, under a separately authorized runtime budget:

  - count opens and bytes per listing, and time to first batch;

  - run the same attribute set over sftp://.

  Then choose a remedy; product-visible tradeoffs go to Ted.'
