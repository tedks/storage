id: field-gio-content-sniff-per-entry
title: Nautilus-style GIO listing on a Storage mount pays a file open per regular
  file (content-type sniff)
desc: 'Field report 2026-11-12, splinter1, 81793ac, docs/field/splinter1-browse-20261112/REPORT.md
  (PR #177).

  On the 700-entry Music root (warm): GIO with listing-level attributes took 0.9-1.2
  s on Storage against 0.19 s on GVFS SFTP to chunk0. strace showed one statx and
  one access per entry, each a FUSE round trip with attr_timeout 0.

  One measurement with standard::* (what Nautilus asks for, including standard::content-type)
  took 94 s. Over file://, GIO can sniff each regular file''s first bytes; through
  Storage each sniff is an open of a probably uncached file (member stat, streaming
  session). GVFS SFTP guesses from the name.

  Because the enumerator returns infos in batches, a Nautilus window can show nothing
  until the first batch''s sniffs finish: this matches the reported "directory hangs
  before anything appears".

  Next: confirm with a bounded, authorized test (count opens per listing, time to
  first batch), then pick a remedy: cheap small opens of uncached files, a mount subtype
  or option that makes GIO guess from names, or a faster getattr/access path. Product-visible
  tradeoffs go to Ted.'
