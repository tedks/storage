id: oq-rsync-upload-selection-args
title: Decide safety policy for caller rsync_args on Storage-selected uploads
desc: 'Decision: how should Storage handle caller-supplied rsync_args when a dirty
  file has already been selected for upload? Blocked interface: public RsyncBackend.__init__(rsync_args)
  pass-through into _run_rsync during copy_from_local, and the SyncExecutor/StorageFS
  assumption that successful copy_from_local means the member now holds the local
  bytes before CLEAN and member-hash baseline publication.


  Synthetic evidence in STORAGE-LOCAL-WRITE-SYNC-20261113: real local rsync with same-size/same-mtime
  differing bytes skips by default, and SyncExecutor publishes CLEAN plus a source-assumed
  member hash. Upload-only --ignore-times fixes the default path, but real rsync still
  skips with caller --size-only. Existing command-construction test permits --exclude=*.tmp.
  The rsync manual also documents --ignore-existing, --update, filter/exclude, size
  limits and dry-run as ways that may prevent a selected file from being transferred.
  No live rsync_args/profile or field file was inspected; field cause is unproven.


  Choice A (recommended): define a reviewed upload-safe transfer/performance argument
  allowlist and reject unsupported rsync_args clearly before upload, so the file remains
  visibly DIRTY/ERROR. Do not silently ignore configured caller options. Choice B:
  preserve arbitrary rsync_args, then measure actual remote content after every upload
  before the callback or CLEAN settlement; this has remote I/O and sync-contract implications
  beyond the current narrow rsync.py package. Ted is the product decider. This decision
  blocks acceptance/merge of the production rsync upload fix, not the synthetic diagnosis.
  Root review receipt STORAGE-RSYNC-ARGS-POLICY-PENDING-20261113; details in docs/local_write_sync_diagnosis_20261113.md.'
