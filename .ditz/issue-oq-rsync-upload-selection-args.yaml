id: oq-rsync-upload-selection-args
title: Decide safety policy for caller rsync_args on Storage-selected uploads
desc: 'Question from STORAGE-LOCAL-WRITE-SYNC-20261113: RsyncBackend accepts arbitrary
  caller rsync_args, including flags that can suppress a transfer after Storage has
  selected a dirty upload. A proposed upload-only --ignore-times appended after caller
  args protects ordinary quick-check and --size-only, but options such as --ignore-existing
  or --update can still skip a selected upload. Options: (1) reject selection-suppressing
  options for uploads (recommendation, failing visibly and preserving DIRTY/ERROR);
  (2) override known suppressing options after caller args, changing their meaning
  silently; (3) allow them and document a false-CLEAN risk, contrary to DESIGN no-silent-loss
  intent. Decision owner: Ted/product authority via storage root. Blocks acceptance
  of a production rsync upload fix, not the source trace or synthetic reproduction.
  See docs/local_write_sync_diagnosis_20261113.md and gh-112-rsync-quickcheck.'
