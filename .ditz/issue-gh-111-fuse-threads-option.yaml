id: gh-111-fuse-threads-option
title: fuse_threads mount option, default off; both modes in the mounted and remote
  gates (threading stage 3)
desc: Threading stage 3 (docs/browsing_latency_plan.md D6, 4.4). fuse_threads in mount
  profiles, CLI and the FUSE() call, default off; shared test mount helper parametrized
  over both modes; remote-gate case where a slow read on one file does not delay a
  listing of another. Waits for lane connections' transport pool on master (libfuse
  2 has no thread cap). Default on (stage 4) follows Ted's field test and is not part
  of this issue.
