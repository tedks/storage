id: conflicts-nobasis-rehash
title: Symlinked or attribute-less duplicates are re-queued (isdir + hash) at every
  listing
desc: 'PR #140 rounds 1 and 2 (Claude nits): check_dir items carry no basis, so each
  listing queues them again; on a member without xxh128sum that is one isdir plus
  one exec per listing, and a transient failure drops a valid record each time. Bounded
  by the single worker; consider remembering the last outcome per (path, member, link
  target).'
