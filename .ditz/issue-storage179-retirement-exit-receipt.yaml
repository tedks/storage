id: storage179-retirement-exit-receipt
title: Preserve retirement exit notice when an agent owns its tmux pane
desc: 'PR179 owner completed and merged. Shared retire-agent flow verified and pushed
  the private recovery handoff, then sent one guarded typed exit. The original process
  is absent and its tmux pane has disappeared; the shared verifier could not capture
  the required fresh same-session native exit notice. Retirement remains pending verification,
  not falsely marked retired. Root owns follow-up: establish an approved alternate
  receipt or fix exit-notice capture for directly launched pane processes; no exit
  replay, process kill, or recovery-shard republication. Exact private event and process
  identity are retained in the controller dispatch record. No Storage application
  or deployment blocker.'
type: bugfix
