id: ssh-mux-close-directory-ownership
title: SSH mux close must revalidate directory ownership
desc: 'Follow up separately from the directory type-confusion repair. ControlSockets.close
  retains only the path and calls shutil.rmtree; if the entry is replaced by a different
  real directory before close, cleanup may delete that replacement tree. Recommend
  capturing and revalidating ownership identity and defining a safe cleanup response.
  Decision owner: storage maintainer. This blocks expanding cleanup behavior in the
  current type-confusion repair; it is not needed to reject a substituted symlink
  or prevent rmtree from traversing the symlink target.'
type: task
