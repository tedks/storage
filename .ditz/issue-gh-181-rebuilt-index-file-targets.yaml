id: gh-181-rebuilt-index-file-targets
title: After a rebuilt index, a file rename has no member targets and records no repair
desc: 'Council round 3 on PR #182 (Anthropic nit 9, pre-existing): rebuild-index leaves
  cached files without member location rows, so NamespaceService.rename computes empty
  targets for a file rename: no member call and no intent. The member silently keeps
  the old name and the CLEAN row can be evicted. Directory renames target every member
  and are covered.'
