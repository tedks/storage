id: streaming-install-outcome-tidy
title: 'Streaming install: tidy the not-installed outcome reporting'
desc: 'Council round 3 nits on #130, none blocking. (1) _discard_superseded_session
  labels the streaming state change ''superseded'' for the ''unsupported'' outcome
  too; the log line carries the real reason. (2) _warned_no_noreplace check-and-set
  is unlocked, so two sessions finalizing at once on a filesystem with neither hard
  links nor RENAME_NOREPLACE can each log the warning (best-effort once per mount;
  harmless). (3) The ''cache-path-filled if taken else outcome'' mapping is duplicated
  in the finalize and promotion log sites; a helper keeps them in step.'
