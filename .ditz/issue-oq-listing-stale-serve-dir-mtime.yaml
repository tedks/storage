id: oq-listing-stale-serve-dir-mtime
title: Should a stale listing be checked against the members before it is served?
desc: "Context:\n- With watchers off (the SSH profiles, splinter1 included), a listing
  is fresh for 60 s (revalidate_after).\n- After that, an access serves the old listing
  and schedules one asynchronous background refresh, until listing_max_stale (3600
  s); past that the directory is relisted in the foreground.\n- Nothing compares the
  members' directory mtime first, so a visit more than 60 s after the last listing
  can lack names added since.\n- The refresh is asynchronous, so the next visit is
  not guaranteed to be current either: the refresh may still be running, waiting on
  a member, or have failed.\n- Ted reported \"fresh files not included\" (2026-11-12).
  It was not reproduced in 17 sampled directories (docs/field/splinter1-browse-20261112/REPORT.md,
  PR #177).\n\nOptions (each reduces stale views; none guarantees a listing is never
  stale):\nA. Keep stale-while-refresh. Lowest latency; a stale first view can persist
  until a refresh publishes.\nB. On a stale access, stat the directory on each member
  and serve the snapshot only if every mtime is unchanged, else relist. Limits:\n
  \  - check-to-use race;\n   - coarse timestamp granularity on some filesystems;\n
  \  - sees only direct entries;\n   - a failing member cannot be checked.\n   Its
  added latency (per-member stat on these members) is unmeasured.\nC. Profile settings:
  a shorter readdir_ttl keeps the same 3600 s stale window, so a stale first view
  remains; watchers need inotify on the members and still miss dropped events.\nD.
  Shorter listing_max_stale, or none, so past the fresh window the directory is relisted
  in the foreground. Pays the full listing latency more often.\n\nLane note (not a
  decision): measure the cost of B's member stat on splinter1 before choosing.\nDecides:
  Ted (freshness versus latency product call).\nBlocks: any change to the stale-serve
  path."
type: task
