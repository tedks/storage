id: gh-111-eviction-nits
title: 'Listing-eviction review nits (PR #115)'
desc: "Nits from the PR #115 council (round 1), deferred with rationale:\n\n1. namespace.unlink
  and namespace.rename remove or rename the cache entry before invalidate_dir_cache_entry.
  rename propagates to members first, over SSH. In that gap, getattr(old) can answer
  from the listing. This is not a regression: the members still hold the name until
  the propagation, so a member probe would answer the same. For consistency with \"forget
  before unlink\", invalidate before touching the cache copy.\n2. Tests:\n   - test_eviction_keeps_a_racing_listing_unpublished
  evicts after the member loop (from _schedule_directory_checksums), not during it.\n
  \  - The lock test holds _dir_cache_lock on the test thread instead of inside a
  real listing.\n   A two-thread barrier test would give stronger evidence (Codex),
  and the lock test could also assert that a listing which started before the eviction
  ends up unpublished (Claude)."
