id: sync-upload-without-location
title: An upload whose sync() or location insert fails leaves bytes on the member
  with no location row
desc: 'Council round 1 on #141 (Claude seat, Important, pre-existing). In SyncExecutor._process_file_task,
  copy_from_local can succeed and backend.sync() or add_file_location then raise;
  the per-member except records a failure, but the bytes are on the member and no
  location row says so. A later rename picks members from location rows (NamespaceService.rename),
  so that member''s copy stays under the old name. Likewise a copy_from_local that
  raises after writing part of the file in place. Fix sketch: record the location
  (or a "possibly written" marker) before sync(), or have a failed attempt delete
  what it may have written; test with a member double whose sync() raises.'
type: bugfix
component: sync
