id: lazy-unmount-late-release
title: A close after a lazy unmount can never reach StorageFS.release
desc: 'Found while building PR #180 (S1 foreground admission), on master behaviour
  (no callback cap), in both FUSE loop modes. Synthetic scratch mount via tests/fuse_mount.run_fuse
  with a LocalBackend member: open a new file for write, write 10 bytes, `fusermount
  -uz` the mount while the descriptor is open, then close it. In 4 of 12 runs (once
  single-threaded) the RELEASE for that descriptor never reached StorageFS before
  the FUSE loop ended and destroy ran: the bytes are in the cache, but release did
  not run, so the close-time sync was not queued in that session. Likely a kernel/libfuse
  ordering: the async release is not delivered once the detached connection ends.
  Not verified: whether the next mount requeues the DIRTY row (post-crash sweep or
  startup), and whether a member-copy (conflict-suffixed) close loses its upload the
  same way. A deterministic version of the race would need control of kernel release
  delivery. PR #180''s mounted test proves exactly-once for closes that reach the
  daemon before unmount, and leaves this case to this issue.'
type: bugfix
component: sync
