- time: 2026-11-18T06:33:51-00:00
  who: Ted Smith
  what: commented
  comment: 'PR #182 round 010b498df605-...-2ba53d, OpenAI Important. A write through
    a conflict view goes to its member at release, after close() returned. Open and
    create refuse fenced views, and flush returns EBUSY for one that gained a repair
    after it was opened. A repair recorded between flush and release still leaves
    the write only in the view''s cache copy, with an error logged. The member''s
    object is never touched. Options: a durable pending-write record for conflict
    views, or move the member copy into flush under a lock that rename''s repair recording
    also takes. Stated as a bound in docs/member-rename-repairs.md Limits.'
- time: 2026-11-18T06:33:52-00:00
  who: Ted Smith
  what: blocks gh-181
  comment: ""
- time: 2026-11-18T06:38:16-00:00
  who: Ted Smith
  what: commented
  comment: 'CTO disposition: an accepted conflict-view write stranded in a derived
    cache with only a log message does not meet the no-silent-loss contract. Before
    #182 acceptance, prevent the unsafe schedule or preserve both the member object
    and the exact local edits as a durable, discoverable outstanding repair. Show
    a forced repair between successful flush and release, including subsequent eviction/reopen
    and index rebuild where preservation is the chosen solution. No automatic replay
    or unbounded retry queue is required.'
