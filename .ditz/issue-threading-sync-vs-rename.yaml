id: threading-sync-vs-rename
title: Sync uploads race a rename of their path
desc: 'From PR #134 council round 1 (Claude seat). Sync workers take no path lock:
  a sync of /a reads its cache path and uploads to /a on the members while a file
  rename (holding only path locks) moves the cache copy and renames the member''s
  /a to /b; the upload can land at /a afterwards and resurrect the old name on that
  member. Pre-existing (the sync worker already runs concurrently with the single
  FUSE thread). Options: the worker takes the path lock around its read-upload-publish,
  or the upload re-checks the row''s path under the index lock before publishing.'
type: bugfix
component: sync
