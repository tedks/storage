  Opus source review flagged possible direct-dependency warnings or failure under
  --check_direct_dependencies=error. This is a nonblocking review nit: C5''s one-version
  rule compares modules shared with the parent, and these two are not parent direct
  dependencies; do not change approved version choices inside #173 merely to silence
  a warning. Reproduce the warning after the baseline stack lands, decide whether
  to align declarations, and review any dependency change separately. Owner: Storage
  controller.'
