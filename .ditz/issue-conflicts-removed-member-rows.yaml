id: conflicts-removed-member-rows
title: Prune persisted hashes of members removed from the profile
desc: 'Follow-up from PR #152 council: member_checksums rows for a member no longer
  in the profile are never selected or deleted. Harmless (never loaded for an absent
  member) but grow forever. Prune rows whose backend_name is not a configured member
  at mount (or in storage debug).'
