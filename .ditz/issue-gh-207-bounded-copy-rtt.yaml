id: gh-207-bounded-copy-rtt
title: Track high-RTT throughput of bounded full copies
desc: 'Before deployment, track the throughput of bounded full copies over high-RTT
  SSH members separately (no field benchmark asked). #208 bounds each full copy at
  its reservation through one sftp.open with prefetch(cap): paramiko 4 queues read-ahead
  only for [0, cap), and dispatches non-prefetched reads as synchronous 32 KiB requests.
  Measure against the previous sftp.get path and decide whether capped read-ahead
  needs tuning (max_concurrent_requests).'
