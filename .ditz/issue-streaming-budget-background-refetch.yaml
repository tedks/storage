id: streaming-budget-background-refetch
title: Background read-ahead near the cache budget downloads a span before learning
  it cannot fit
desc: 'From council on #191 (round-1 Anthropic N2, round-2 OpenAI nit). Any successful
  foreground write clears cache_full, re-enabling background read-ahead, which downloads
  a whole span before ensure_space refuses it and discards it: one wasted chunk of
  member bandwidth per small foreground read near the budget. A free-space pre-check
  would pause too early or evict before data arrives; needs its own design.'
