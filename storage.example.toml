# Example mount profile. Copy to ~/.config/storage/storage.toml (or pass
# with --config) and replace the host, paths and key with your own.
[mounts.example-media]
mountpoint = "/home/user/mnt/media"
cache = "/home/user/.cache/storage/media"
cache_size = "50G"
database = "/home/user/.cache/storage/media/.storage.db"
workers = 2
key_file = "/home/user/.ssh/id_ed25519"
# Host keys are not configurable yet (#107, #30). SFTP (paramiko) trusts any
# key and remembers none. rsync uploads and the remote watcher (when
# enabled) use ssh's StrictHostKeyChecking=accept-new and write your
# known_hosts (normally ~/.ssh/known_hosts); after a member's key changes they fail with "REMOTE
# HOST IDENTIFICATION HAS CHANGED" while SFTP keeps working. Verify the new
# key's fingerprint, then `ssh-keygen -R <host>`. See "SSH host keys" in
# README.md.
foreground = true
streaming_reads = true
streaming_chunk_size = "1M"
max_streaming_sessions = 8
# Keep prefetching after the last reader closes once readers have read a
# contiguous span this long: comma-separated sizes or percentages of the
# file, whichever is reached first. Unset means 4 chunks or 50% ("4M,50%"
# at the 1M chunk above); "0" keeps prefetching after any read; "100%"
# effectively never keeps prefetching after a close. Until readers reach it,
# read-ahead while the file is open also stays within this far past what
# they read.
streaming_keep_after_close = "4M,50%"
# Seconds after which opening a cached, synced file stats the member that
# holds it and refetches the file if the member's copy changed. 0 checks at
# every open.
revalidate_after = 60
# Seconds a directory listing answers ls, stat and missing names without
# asking a member. Unset, it follows revalidate_after.
# readdir_ttl = 60
# Past that a listing is still served while a background listing replaces
# it, until it is this many seconds old.
listing_max_stale = 3600
# Kernel cache timeouts in seconds. Unset, names are kept for
# revalidate_after (1 with enable_watchers) and missing names for 10.
# Attributes are never kept: a kept size would truncate reads of a
# refetched file.
# entry_timeout = 60
# negative_timeout = 10
# Serve FUSE requests on several threads, so a slow member call for one file
# does not hold up listings, stats and reads of others. Off by default until
# it has been field-tested.
# fuse_threads = true
backends = [
  "ssh://user@storage-host.example:/srv/raid/media/",
  "ssh://user@storage-host.example:/srv/chunk0/media/",
  "ssh://user@storage-host.example:/srv/chunk1/media/",
]
