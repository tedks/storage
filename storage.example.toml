# Example mount profile. Copy to ~/.config/storage/storage.toml (or pass
# with --config) and replace the host, paths and key with your own.
[mounts.example-media]
mountpoint = "/home/user/mnt/media"
cache = "/home/user/.cache/storage/media"
cache_size = "50G"
database = "/home/user/.cache/storage/media/.storage.db"
workers = 2
# Optional: grow background sync workers when distinct tasks queue, then
# return to `workers` after 30 idle seconds. Leave unset for the historical
# fixed pool. Maximum: the smallest of 32 (local members only), 8 (any remote
# member) and, per ssh:// member, its background SFTP channels (3 by
# default). With ssh:// members, as here, at most 3.
# max_sync_workers = 3
key_file = "/home/user/.ssh/id_ed25519"
# Opt in to sharing one authenticated OpenSSH connection per compatible
# login across SFTP, commands, rsync, and the watcher.
# ssh_transport = "openssh"
# With the default transport, SFTP (Paramiko) trusts any
# key and remembers none. rsync uploads and the remote watcher (when
# enabled) use ssh's StrictHostKeyChecking=accept-new and write your
# known_hosts (normally ~/.ssh/known_hosts); after a member's key changes they fail with "REMOTE
# HOST IDENTIFICATION HAS CHANGED" while SFTP keeps working. Verify the new
# key's fingerprint, then `ssh-keygen -R <host>`. See "SSH host keys" in
# README.md.
foreground = true
streaming_reads = true
streaming_chunk_size = "1M"
# Workers start as chunks become runnable and retire after 30 idle seconds.
# Set a positive number to throttle background transfers.
# max_download_workers = 4
# Retain unfinished downloads after the longest contiguous requested span
# reaches the larger of 32 MiB and 30% of the file, capped at the file size.
# Without "all:" a comma-separated list uses the first threshold reached.
# "0" qualifies after any read; "100%" requires reading the whole file.
streaming_keep_after_close = "all:32M,30%"
# Maximum speculative read-ahead beyond the latest read span before it
# qualifies. Use "0" to disable pre-qualification read-ahead.
streaming_read_ahead_window = "4M"
# Seconds after which opening a cached, synced file stats the member that
# holds it and refetches the file if the member's copy changed. 0 checks at
# every open.
revalidate_after = 60
# Seconds a directory listing answers ls, stat and missing names without
# asking a member. Unset, it follows revalidate_after.
# readdir_ttl = 60
# Past that a listing is still served while a background listing replaces
# it, until it is this many seconds old.
listing_max_stale = 3600
# Return the first member response; later directory reads see additional names.
progressive_listings = false
# Kernel cache timeouts in seconds. Unset, names are kept for
# revalidate_after (1 with enable_watchers) and missing names for 10.
# Attributes are never kept: a kept size would truncate reads of a
# refetched file.
# entry_timeout = 60
# negative_timeout = 10
# Serve FUSE requests on several threads, so a slow member call for one file
# does not hold up listings, stats and reads of others. Off by default until
# it has been field-tested.
# fuse_threads = true
# Cap admitted FUSE callbacks, 4-128 (setting it turns on fuse_threads).
# Two slots are kept for reads and writes of cached files (and their opens),
# one for metadata reads and one for everything else, including streaming
# reads of uncached files and every unlink; the rest are shared. init,
# destroy, release, releasedir and flush are not admitted and run alongside
# the cap. The last close of a file unlinked while open can still wait: libfuse
# unlinks its hidden name inside that close, and the unlink takes an
# ordinary slot. A queued callback is not cancelled by an interrupt or an
# unmount, so either can wait for the queue to drain. libfuse's own threads
# are not capped. Unset: no cap.
# max_foreground_operations = 8
# Bulk SSH copies wait for SFTP channel capacity as the queue drains. A
# positive finite value opts into a capacity deadline; on a threaded mount,
# an existing cold file whose bulk copy times out then reports EAGAIN.
# Single-threaded foreground copies keep their interactive class. Unset or 0
# leaves the deadline off. SSH
# connection and transfer timeouts remain separate.
# bulk_capacity_wait_timeout = 30
# Seconds between re-verifications of the conflict view's recorded hashes:
# each interval, every member whose hash queue is idle hashes again the one
# file checked longest ago (and over an hour ago). 0 turns it off.
# checksum_reverify_interval = 60
backends = [
  { spec = "ssh://user@storage-host.example:/srv/raid/media/", name = "RAID media" },
  { spec = "ssh://user@storage-host.example:/srv/chunk0/media/", name = "Chunk 0 media" },
  { spec = "ssh://user@storage-host.example:/srv/chunk1/media/", name = "Chunk 1 media" },
]
